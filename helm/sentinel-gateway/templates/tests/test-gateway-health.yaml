apiVersion: v1
kind: Pod
metadata:
  name: {{ include "sentinel-gateway.fullname" . }}-test-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sentinel-gateway.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test-health
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -c
        - |
          echo "Testing gateway health endpoint..."
          curl -sf http://{{ include "sentinel-gateway.fullname" . }}:{{ .Values.service.port }}/actuator/health \
            && echo "PASS: /actuator/health returned 200" \
            || (echo "FAIL: /actuator/health did not return 200" && exit 1)
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

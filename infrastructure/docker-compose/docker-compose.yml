version: "3.9"

# ─── Phase 1 Docker Compose ───────────────────────────────────────────────────
# Starts: sentinel-gateway + hello-service
#
# Usage:
#   docker compose up --build        # Build images and start
#   docker compose up -d             # Start detached
#   docker compose down              # Stop and remove containers
#   docker compose logs -f           # Follow logs
#
# Test after startup:
#   curl http://localhost:8080/api/hello
#   curl http://localhost:8080/actuator/health
#
# Infrastructure services (PostgreSQL, Redis, Kafka, Keycloak) are added
# in later phases. Placeholders are commented out below for reference.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Sentinel Gateway ──────────────────────────────────────────────────────
  sentinel-gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    container_name: sentinel-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      HELLO_SERVICE_URL: "http://hello-service:8081"
      GATEWAY_PORT: "8080"
    depends_on:
      hello-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - sentinel-network

  # ── Hello Service (Phase 1 smoke-test downstream) ─────────────────────────
  hello-service:
    build:
      context: ../..
      dockerfile: test-services/hello-service/Dockerfile
    container_name: hello-service
    ports:
      - "${HELLO_SERVICE_PORT:-8081}:8081"
    environment:
      HELLO_SERVICE_PORT: "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - sentinel-network

  # ── Future phases — uncomment when adding infrastructure ──────────────────
  #
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: sentinelgateway
  #     POSTGRES_USER: sentinelgateway
  #     POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #
  # redis:
  #   image: redis:7-alpine
  #   command: redis-server --requirepass ${REDIS_PASSWORD}
  #   volumes:
  #     - redis-data:/data
  #
  # kafka:
  #   image: confluentinc/cp-kafka:7.7.0
  #   ...
  #
  # keycloak:
  #   image: quay.io/keycloak/keycloak:25.0
  #   ...

networks:
  sentinel-network:
    driver: bridge

volumes:
  # Placeholder volumes for future phases
  postgres-data:
    driver: local
  redis-data:
    driver: local

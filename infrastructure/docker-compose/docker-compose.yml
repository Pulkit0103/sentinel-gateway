version: "3.9"

# ─── Phase 3 Docker Compose ───────────────────────────────────────────────────
# Starts: sentinel-gateway + hello-service + Keycloak (OAuth2/OIDC IdP)
#
# Usage:
#   docker compose up --build        # Build images and start
#   docker compose up -d             # Start detached
#   docker compose down              # Stop and remove containers
#   docker compose logs -f           # Follow logs
#
# Test after startup:
#   # Get token from Keycloak
#   TOKEN=$(curl -s -X POST http://localhost:8180/realms/sentinel/protocol/openid-connect/token \
#     -d 'client_id=sentinel-gateway-client&grant_type=password' \
#     -d 'username=alice&password=alice-password' | jq -r .access_token)
#   curl -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/hello
#   curl http://localhost:8080/actuator/health
#
# Infrastructure services (PostgreSQL, Redis, Kafka) are added in later phases.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Keycloak — OAuth2/OIDC Identity Provider ──────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8080"
    volumes:
      - ../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/sentinel || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - sentinel-network

  # ── Sentinel Gateway ──────────────────────────────────────────────────────
  sentinel-gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    container_name: sentinel-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      HELLO_SERVICE_URL: "http://hello-service:8081"
      GATEWAY_PORT: "8080"
      KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/sentinel/protocol/openid-connect/certs"
      KEYCLOAK_ISSUER: "http://localhost:8180/realms/sentinel"
    depends_on:
      keycloak:
        condition: service_healthy
      hello-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - sentinel-network

  # ── Hello Service (smoke-test downstream) ─────────────────────────────────
  hello-service:
    build:
      context: ../..
      dockerfile: test-services/hello-service/Dockerfile
    container_name: hello-service
    ports:
      - "${HELLO_SERVICE_PORT:-8081}:8081"
    environment:
      HELLO_SERVICE_PORT: "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - sentinel-network

  # ── Future phases — uncomment when adding infrastructure ──────────────────
  #
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: sentinelgateway
  #     POSTGRES_USER: sentinelgateway
  #     POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #
  # redis:
  #   image: redis:7-alpine
  #   command: redis-server --requirepass ${REDIS_PASSWORD}
  #   volumes:
  #     - redis-data:/data
  #
  # kafka:
  #   image: confluentinc/cp-kafka:7.7.0
  #   ...

networks:
  sentinel-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

name: sentinel-gateway

# ─── Phase 19: Full Local Stack ───────────────────────────────────────────────
# Complete development environment: all services + infrastructure.
#
# Prerequisites: copy .env.example → .env and adjust passwords/ports.
#
# Quick start:
#   cp .env.example .env
#   docker compose up --build          # Build all images and start
#   docker compose up -d               # Start detached
#   docker compose logs -f gateway     # Follow gateway logs
#   docker compose down -v             # Stop and remove volumes
#
# Service URLs (defaults):
#   Gateway:    http://localhost:8080
#   Keycloak:   http://localhost:8180  (admin/admin)
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000  (admin/admin)
#   Dashboard:  http://localhost:3001  (Next.js admin dashboard)
#
# Get an admin token:
#   TOKEN=$(curl -s -X POST http://localhost:8180/realms/sentinel/protocol/openid-connect/token \
#     -d 'client_id=sentinel-gateway-client&grant_type=password' \
#     -d 'username=alice&password=alice-password' | jq -r .access_token)
#   curl -H "Authorization: Bearer $TOKEN" http://localhost:8080/admin/routes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgresql:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_DB: sentinelgateway
      POSTGRES_USER: sentinelgateway
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-sentinel_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelgateway -d sentinelgateway"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - sentinel-network

  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - sentinel-network

  kafka:
    image: bitnami/kafka:3.7
    container_name: sentinel-kafka
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/bitnami/kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - sentinel-network

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8180}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: "8080"
    volumes:
      - ../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/realms/sentinel || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - sentinel-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sentinel-prometheus
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - sentinel-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: sentinel-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/gateway.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - sentinel-network

  # ── Gateway ─────────────────────────────────────────────────────────────────

  sentinel-gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    container_name: sentinel-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      GATEWAY_PORT: "8080"
      # JWT / Keycloak
      KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/sentinel/protocol/openid-connect/certs"
      KEYCLOAK_ISSUER: "http://localhost:${KEYCLOAK_PORT:-8180}/realms/sentinel"
      # Persistence — PostgreSQL R2DBC (replaces in-memory H2)
      R2DBC_URL: "r2dbc:postgresql://sentinelgateway:${DATABASE_PASSWORD:-sentinel_secret}@postgresql:5432/sentinelgateway"
      SPRING_SQL_INIT_MODE: "never"
      # Redis — rate limiting, quotas, nonce store
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: "${REDIS_PASSWORD:-redis_secret}"
      # Enable rate limiting and quotas now that Redis is available
      SENTINEL_RATE_LIMIT_ENABLED: "true"
      SENTINEL_QUOTA_ENABLED: "true"
      SENTINEL_THREAT_DETECTION_ENABLED: "true"
      # Kafka — audit event streaming
      SENTINEL_AUDIT_KAFKA_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      # HMAC signing — disabled by default, opt-in
      HMAC_SHARED_SECRET: "${HMAC_SHARED_SECRET:-change-me-in-production}"
      # Downstream service discovery
      HELLO_SERVICE_URL: "http://hello-service:8081"
      USER_SERVICE_URL: "http://user-service:8082"
      ORDER_SERVICE_URL: "http://order-service:8083"
      PAYMENT_SERVICE_URL: "http://payment-service:8084"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    networks:
      - sentinel-network

  # ── Test Downstream Services ─────────────────────────────────────────────────

  hello-service:
    build:
      context: ../..
      dockerfile: test-services/hello-service/Dockerfile
    container_name: hello-service
    ports:
      - "${HELLO_SERVICE_PORT:-8081}:8081"
    environment:
      HELLO_SERVICE_PORT: "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - sentinel-network

  user-service:
    build:
      context: ../..
      dockerfile: test-services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "${USER_SERVICE_PORT:-8082}:8082"
    environment:
      USER_SERVICE_PORT: "8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - sentinel-network

  order-service:
    build:
      context: ../..
      dockerfile: test-services/order-service/Dockerfile
    container_name: order-service
    ports:
      - "${ORDER_SERVICE_PORT:-8083}:8083"
    environment:
      ORDER_SERVICE_PORT: "8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - sentinel-network

  payment-service:
    build:
      context: ../..
      dockerfile: test-services/payment-service/Dockerfile
    container_name: payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT:-8084}:8084"
    environment:
      PAYMENT_SERVICE_PORT: "8084"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - sentinel-network

  # ── Admin Dashboard (optional — comment out if not building frontend) ────────

  admin-dashboard:
    build:
      context: ../../admin-dashboard
      dockerfile: Dockerfile
    container_name: sentinel-dashboard
    ports:
      - "${DASHBOARD_PORT:-3001}:3001"
    environment:
      NEXT_PUBLIC_GATEWAY_URL: "http://localhost:${GATEWAY_PORT:-8080}"
    depends_on:
      sentinel-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sentinel-network

networks:
  sentinel-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:

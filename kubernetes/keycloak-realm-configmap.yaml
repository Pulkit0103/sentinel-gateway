apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: sentinel
data:
  realm-export.json: |
    {
      "realm": "sentinel",
      "enabled": true,
      "displayName": "Sentinel Gateway",
      "accessTokenLifespan": 300,
      "refreshTokenMaxReuse": 0,
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": false,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "roles": {
        "realm": [
          { "name": "ADMIN",   "description": "Full administrative access" },
          { "name": "USER",    "description": "Standard user access" },
          { "name": "SUPPORT", "description": "Read-only support access" },
          { "name": "SERVICE", "description": "Machine-to-machine service account" }
        ]
      },
      "clients": [
        {
          "clientId": "sentinel-gateway-client",
          "name": "Sentinel Gateway Client",
          "enabled": true,
          "publicClient": true,
          "directAccessGrantsEnabled": true,
          "standardFlowEnabled": true,
          "protocol": "openid-connect",
          "redirectUris": ["http://localhost:*", "https://localhost:*"],
          "webOrigins": ["http://localhost:*"],
          "defaultClientScopes": ["openid", "profile", "email", "roles"]
        },
        {
          "clientId": "sentinel-gateway-m2m",
          "name": "Sentinel Gateway M2M",
          "enabled": true,
          "publicClient": false,
          "serviceAccountsEnabled": true,
          "directAccessGrantsEnabled": false,
          "standardFlowEnabled": false,
          "protocol": "openid-connect",
          "secret": "${KEYCLOAK_M2M_SECRET:change-me-in-production}",
          "defaultClientScopes": ["openid", "profile", "roles"]
        }
      ],
      "users": [
        {
          "username": "alice",
          "email": "alice@example.com",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            { "type": "password", "value": "alice-password", "temporary": false }
          ],
          "realmRoles": ["USER"],
          "attributes": { "tenant_id": ["tenant-acme"] }
        },
        {
          "username": "bob-admin",
          "email": "bob@example.com",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            { "type": "password", "value": "bob-password", "temporary": false }
          ],
          "realmRoles": ["USER", "ADMIN"],
          "attributes": { "tenant_id": ["tenant-acme"] }
        },
        {
          "username": "carol-support",
          "email": "carol@example.com",
          "enabled": true,
          "emailVerified": true,
          "credentials": [
            { "type": "password", "value": "carol-password", "temporary": false }
          ],
          "realmRoles": ["SUPPORT"],
          "attributes": { "tenant_id": ["tenant-globex"] }
        }
      ],
      "protocolMappers": [
        {
          "name": "tenant-id-mapper",
          "protocol": "openid-connect",
          "protocolMapper": "oidc-usermodel-attribute-mapper",
          "consentRequired": false,
          "config": {
            "userinfo.token.claim": "true",
            "user.attribute": "tenant_id",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "claim.name": "tenant_id",
            "jsonType.label": "String"
          }
        }
      ]
    }

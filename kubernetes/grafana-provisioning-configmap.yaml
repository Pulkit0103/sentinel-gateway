apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: sentinel
data:
  datasources/prometheus.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboards/provider.yml: |
    apiVersion: 1
    providers:
      - name: 'Sentinel Gateway'
        orgId: 1
        folder: 'Sentinel Gateway'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards
  dashboards/gateway.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "datasource": {"type": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}, "overrides": []},
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 0},
          "id": 1,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "title": "Total Requests",
          "type": "stat",
          "targets": [{"expr": "sum(gateway_requests_total)", "legendFormat": "Total", "refId": "A"}]
        },
        {
          "datasource": {"type": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 0.05}]}}, "overrides": []},
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 0},
          "id": 2,
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background"},
          "title": "Error Rate",
          "type": "stat",
          "targets": [{"expr": "sum(gateway_requests_total{outcome=~'UNAUTHENTICATED|UNAUTHORIZED|BLOCKED.*'}) / sum(gateway_requests_total)", "legendFormat": "Error Rate", "refId": "A"}]
        },
        {
          "datasource": {"type": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"lineWidth": 1, "fillOpacity": 10}}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 3,
          "title": "Request Rate by Route (req/s)",
          "type": "timeseries",
          "targets": [{"expr": "sum(rate(gateway_requests_total[1m])) by (route)", "legendFormat": "{{route}}", "refId": "A"}]
        },
        {
          "datasource": {"type": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "custom": {"lineWidth": 1, "fillOpacity": 10}, "unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "id": 4,
          "title": "P95 Request Duration",
          "type": "timeseries",
          "targets": [{"expr": "histogram_quantile(0.95, sum(rate(gateway_request_duration_seconds_bucket[1m])) by (le, route))", "legendFormat": "p95 {{route}}", "refId": "A"}]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["sentinel-gateway"],
      "time": {"from": "now-1h", "to": "now"},
      "title": "Sentinel Gateway",
      "uid": "sentinel-gateway-overview",
      "version": 1
    }

name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  JAVA_VERSION: "17"
  REGISTRY: ghcr.io

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -pl gateway -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push versioned gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/sentinel-gateway:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/sentinel-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Sentinel Gateway ${{ github.ref_name }}

            ### Docker Image
            ```
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/sentinel-gateway:${{ github.ref_name }}
            ```

            ### Quick Start (Docker Compose)
            ```bash
            cp infrastructure/docker-compose/.env.example infrastructure/docker-compose/.env
            cd infrastructure/docker-compose && docker compose up -d
            ```

            ### Kubernetes (kubectl)
            ```bash
            kubectl apply -k kubernetes/
            ```

            ### Helm
            ```bash
            helm install sentinel-gateway helm/sentinel-gateway/ \
              --namespace sentinel --create-namespace \
              --set secrets.databasePassword=<your-password> \
              --set secrets.redisPassword=<your-password> \
              --set secrets.hmacSharedSecret=<your-secret>
            ```

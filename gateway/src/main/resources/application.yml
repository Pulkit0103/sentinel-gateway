server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: sentinel-gateway
  main:
    web-application-type: reactive
  autoconfigure:
    # Exclude Spring Cloud Gateway's built-in Redis rate limiter auto-configuration.
    # We implement our own fixed-window rate limiter (SentinelRedisRateLimiter).
    # This also prevents BeanDefinitionOverrideException and ConfigurationService
    # dependency failures in non-gateway test contexts.
    exclude: org.springframework.cloud.gateway.config.GatewayRedisAutoConfiguration
  r2dbc:
    # In-memory H2 for local dev — override R2DBC_URL with PostgreSQL in prod/Docker
    url: ${R2DBC_URL:r2dbc:h2:mem:///sentinel;DB_CLOSE_DELAY=-1}
  sql:
    init:
      mode: always
  data:
    redis:
      # Override REDIS_HOST / REDIS_PORT for Docker/K8s; defaults to localhost dev instance
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak JWKS endpoint — override with KEYCLOAK_JWKS_URI env var in Docker/K8s
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/sentinel/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    # Redis is used for rate limiting only; rate limiting fails open when Redis is down.
    # Excluding Redis from health rollup prevents an unavailable Redis from marking
    # the gateway DOWN — the gateway can still serve traffic with rate limiting disabled.
    redis:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: Sentinel Gateway
    version: 0.1.0-SNAPSHOT
    description: Zero-Trust API Security and Traffic Management Platform
    phase: Phase 3 - OAuth2/OIDC/Keycloak

# ─── Route Definitions ────────────────────────────────────────────────────────
# Each entry maps to a RouteDefinition domain object.
# Disabled routes are not registered; requests to their paths return 404.
# Method restrictions return 405 on mismatch.
#
# Future phases will move this to a database-backed RouteDefinitionRepository.
# ─────────────────────────────────────────────────────────────────────────────
sentinel:
  rate-limit:
    enabled: false  # set to true when Redis is available (Docker/K8s)
    policies:
      ANONYMOUS:
        requests-per-minute: 100
      USER:
        requests-per-minute: 1000
      PREMIUM:
        requests-per-minute: 10000
      DEFAULT:
        requests-per-minute: 1000
  security:
    jwt:
      # Token issuer validated against every incoming JWT's `iss` claim.
      # Must match the Keycloak realm URL exactly (scheme + host + port + path).
      issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/sentinel}
  gateway:
    routes:
      - route-id: hello-service
        path: /api/hello/**
        service-uri: ${HELLO_SERVICE_URL:http://localhost:8081}
        methods: [GET]
        enabled: true
        required-scopes: []
        tenant-required: false
        rate-limit-policy: DEFAULT

      - route-id: user-service
        path: /api/users/**
        service-uri: ${USER_SERVICE_URL:http://localhost:8082}
        methods: [GET, POST, PUT, PATCH, DELETE]
        enabled: true
        required-scopes: []
        tenant-required: false
        rate-limit-policy: DEFAULT

      - route-id: order-service
        path: /api/orders/**
        service-uri: ${ORDER_SERVICE_URL:http://localhost:8083}
        methods: [GET, POST, PUT, PATCH, DELETE]
        enabled: true
        required-scopes: []
        tenant-required: false
        rate-limit-policy: DEFAULT

      - route-id: payment-service
        path: /api/payments/**
        service-uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
        methods: [GET, POST]
        enabled: true
        required-scopes: []
        tenant-required: false
        rate-limit-policy: DEFAULT

      # Example of a disabled route — demonstrates the disable feature.
      # Requests to /api/legacy/** will receive 404.
      - route-id: legacy-service
        path: /api/legacy/**
        service-uri: http://localhost:9999
        methods: [GET]
        enabled: false
        required-scopes: []
        tenant-required: false
        rate-limit-policy: DEFAULT

logging:
  level:
    root: INFO
    com.sentinelgateway: DEBUG
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{X-Request-ID}] %logger{36} - %msg%n"

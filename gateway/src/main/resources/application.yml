server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful   # drain in-flight requests before JVM exit

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s   # match terminationGracePeriodSeconds in K8s
  application:
    name: sentinel-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        # Global HTTP client timeouts; per-route sentinel.resilience.timeout-ms overrides the response timeout.
        connect-timeout: 3000      # 3 s to establish TCP connection
        response-timeout: 30000ms  # 30 s global response deadline (reduced per route via filter)
    globalcors:
      # Allow the admin dashboard (localhost:3001) to call the gateway from a browser.
      # Preflight OPTIONS requests are also permitted in SecurityConfig.
      add-to-simple-url-handler-mapping: true
      corsConfigurations:
        '[/**]':
          allowedOrigins:
            - "http://localhost:3001"
          allowedMethods: [GET, POST, DELETE, PUT, PATCH, OPTIONS]
          allowedHeaders: ["*"]
          maxAge: 3600
    discovery:
      client:
        simple:
          # Static service instances for local dev / Docker Compose.
          # In Kubernetes these are replaced by DNS-backed service entries
          # auto-populated by spring-cloud-starter-kubernetes-client-all.
          # Instance URIs accept env-var overrides for Docker Compose.
          instances:
            hello-service:
              - uri: ${HELLO_SERVICE_URL:http://localhost:8081}
            user-service:
              - uri: ${USER_SERVICE_URL:http://localhost:8082}
            order-service:
              - uri: ${ORDER_SERVICE_URL:http://localhost:8083}
            payment-service:
              - uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
  autoconfigure:
    # 1. GatewayRedisAutoConfiguration — we supply our own rate limiter bean.
    # 2. KafkaAutoConfiguration — we configure Kafka manually only when
    #    sentinel.audit.kafka.enabled=true so Kafka absence never fails the context.
    exclude:
      - org.springframework.cloud.gateway.config.GatewayRedisAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  r2dbc:
    # In-memory H2 for local dev — override R2DBC_URL with PostgreSQL in prod/Docker
    url: ${R2DBC_URL:r2dbc:h2:mem:///sentinel;DB_CLOSE_DELAY=-1}
  sql:
    init:
      mode: always
  data:
    redis:
      # Override REDIS_HOST / REDIS_PORT for Docker/K8s; defaults to localhost dev instance
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak JWKS endpoint — override with KEYCLOAK_JWKS_URI env var in Docker/K8s
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/sentinel/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
      # Liveness: JVM alive, Spring context started, not deadlocked
      # Readiness: app ready to serve traffic (set to REFUSING_TRAFFIC during graceful shutdown)
      # Both groups are required for Kubernetes liveness/readiness probes to work.
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    # Kubernetes liveness/readiness state contributors must be explicitly enabled
    # so that /actuator/health/liveness and /actuator/health/readiness groups work.
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # Redis is used for rate limiting only; rate limiting fails open when Redis is down.
    # Excluding Redis from health rollup prevents an unavailable Redis from marking
    # the gateway DOWN — the gateway can still serve traffic with rate limiting disabled.
    redis:
      enabled: false
  info:
    env:
      enabled: true
  tracing:
    sampling:
      probability: 1.0  # 100% sampling; reduce in high-traffic prod environments

info:
  app:
    name: Sentinel Gateway
    version: 0.4.0-SNAPSHOT
    description: Zero-Trust API Security and Traffic Management Platform
    phase: Phase 4 - Request/Response Transformation

# ─── Route Definitions ────────────────────────────────────────────────────────
# Each entry maps to a RouteDefinition domain object.
# Disabled routes are not registered; requests to their paths return 404.
# Method restrictions return 405 on mismatch.
#
# Future phases will move this to a database-backed RouteDefinitionRepository.
# ─────────────────────────────────────────────────────────────────────────────
sentinel:
  slow-request:
    enabled: true        # detect and record requests exceeding threshold-ms
    threshold-ms: 2000   # requests taking longer than this (in ms) are recorded
    max-records: 100     # ring-buffer capacity

  request-sanitizer:
    enabled: true            # validate header safety on every request
    max-header-value-length: 8192  # reject header values longer than this (bytes)
    block-null-bytes: true   # reject header values containing null bytes (\0)

  security-headers:
    enabled: true   # adds OWASP recommended security headers to every response
    # headers:
    #   X-Content-Type-Options: nosniff          # default
    #   X-Frame-Options: DENY                    # default
    #   Referrer-Policy: strict-origin-when-cross-origin  # default
    #   X-XSS-Protection: "0"                   # default
    #   Permissions-Policy: "geolocation=()"    # optional addition

  content-type-stats:
    enabled: true   # track response Content-Type distribution (application/json, text/html, etc.)

  user-agent-stats:
    enabled: true   # track request User-Agent category distribution (browser, mobile, bot, service)

  ip-counter:
    enabled: true   # track per-IP request counts and expose top-N "top talkers" list
    top-n: 20       # number of top IPs returned in /admin/ip-stats

  clock-skew:
    enabled: true                   # detect requests with X-Request-Timestamp far from server time
    header-name: X-Request-Timestamp  # epoch-second timestamp header sent by clients
    tolerance-seconds: 300          # flag requests whose timestamp deviates by more than this
    max-records: 100                # ring-buffer capacity for skewed-request history

  header-audit:
    enabled: true   # audit presence/absence of security and cache-control headers on responses
    tracked-headers:
      - Content-Security-Policy
      - X-Content-Type-Options
      - X-Frame-Options
      - Strict-Transport-Security
      - Cache-Control
      - Referrer-Policy

  accept-stats:
    enabled: true   # track request Accept header distribution (application/json, text/html, etc.)

  route-traffic:
    enabled: true   # track per-route request counts within 1-min, 5-min, 15-min sliding windows

  encoding-stats:
    enabled: true   # track request Content-Encoding distribution (gzip, br, deflate, none)

  error-path:
    enabled: true   # record recent 4xx/5xx error responses with path and status for triage
    max-records: 200  # ring-buffer capacity for error history

  cache-ttl:
    enabled: true   # track response Cache-Control max-age distribution (no-cache/short/medium/long)

  header-count:
    enabled: true   # track request header count distribution (low/normal/elevated/high buckets)

  response-header-size:
    enabled: true   # track response header total-size distribution (small/medium/large/oversized)

  query-param-count:
    enabled: true   # track request query-parameter count distribution (zero/few/moderate/many)

  scheme-stats:
    enabled: true   # track request URI scheme distribution (http, https)

  path-depth:
    enabled: true   # track URL path-depth distribution (root/shallow/moderate/deep segments)

  referer-stats:
    enabled: true   # track Referer header domain distribution (top-N domains by request count)
    top-n: 20

  route-error-rate:
    enabled: true   # track per-route error (4xx/5xx) rates in 1-min/5-min/15-min sliding windows

  throughput:
    enabled: true   # track request throughput (RPS) in 1s/10s/60s sliding windows with peak tracking

  method-stats:
    enabled: true   # track request count distribution by HTTP method (GET, POST, PUT, DELETE, etc.)

  hop-count:
    enabled: true   # reject requests with more X-Forwarded-For hops than max-hops (routing loop guard)
    max-hops: 10    # requests with more than this many proxy hops receive 400

  path-length:
    enabled: true            # reject requests with excessively long paths or query strings
    max-path-length: 2048    # 414 URI Too Long if path exceeds this
    max-query-length: 4096   # 400 Bad Request if query string exceeds this
    max-records: 100         # ring-buffer capacity for rejection history

  response-size:
    enabled: true   # track response Content-Length distribution for bandwidth monitoring
    max-records: 200  # ring-buffer depth for recent sample history

  concurrent-requests:
    enabled: true   # track in-flight request count, peak concurrency, and total completed

  status-codes:
    enabled: true   # track HTTP response status code distribution (per-code and 2xx/3xx/4xx/5xx)

  latency:
    enabled: true                    # track per-route response latency percentiles
    max-samples-per-route: 1000      # ring-buffer depth per route

  request-size:
    enabled: true              # reject requests whose Content-Length exceeds max-body-bytes
    max-body-bytes: 10485760   # 10 MB default; requests declaring a larger body receive 413
    max-records: 100           # ring-buffer capacity for oversized-request history

  jwt-expiry-warning:
    enabled: true              # add X-JWT-Expires-In header when JWT is expiring soon
    warning-window-seconds: 300  # warn when JWT expires within this many seconds
    header-name: X-JWT-Expires-In  # response header name for the expiry warning

  ip-access:
    enabled: false  # set to true to enable IP-based access control
    mode: DENYLIST  # DENYLIST (block listed IPs) or ALLOWLIST (only allow listed IPs)
    # global-list:
    #   - "10.0.0.1"
    # routes:
    #   payment-service:
    #     - "192.168.1.100"

  claim-authorization:
    enabled: false  # set to true and configure routes map to enforce JWT claim values per route
    # routes:
    #   payment-service:
    #     - claim: department
    #       allowed-values: [finance, engineering]

  sla:
    enabled: false  # set to true and configure routes map to track response time SLAs
    # routes:
    #   payment-service: 500   # must respond within 500ms
    #   order-service: 1000

  required-headers:
    enabled: false  # set to true and configure routes map to enforce required headers per route
    # routes:
    #   payment-service:
    #     - X-Idempotency-Key
    #   order-service:
    #     - X-Correlation-Id

  maintenance:
    enabled: false  # set to true via POST /admin/maintenance/enable to block all upstream traffic
    message: "Service temporarily unavailable for maintenance"
    retry-after-seconds: 60
    bypass-roles:
      - ROLE_ADMIN

  drain:
    enabled: true
    timeout-seconds: 30

  transform:
    sanitize-request-headers:
      - X-User-Id
      - X-Tenant-Id
      - X-User-Roles
      - X-Auth-Type
    remove-response-headers:
      - Server
      - X-Powered-By
      - Via

  analytics:
    enabled: true
    retention-days: 7
    top-n: 10

  cache:
    enabled: false  # set to true when Redis is available (Docker/K8s)

  audit:
    kafka:
      enabled: false  # set to true when Kafka is available (Docker/K8s)
      topic: sentinel.audit.requests

  threat-detection:
    enabled: false  # set to true to enable WAF-style pattern detection
    log-threshold: 25    # score >= this → LOG (pass with warning)
    block-threshold: 60  # score >= this → BLOCK (400)
    alert-threshold: 90  # score >= this → BLOCK + high-severity alert
    blocked-ips: []

  policy:
    policies:
      - policy-id: user-service-policy
        route-id: user-service
        require-mfa: false
        request-signing-required: false
        required-scopes: []
        allowed-methods: [GET, POST, PUT, PATCH, DELETE]
        rate-limit-policy: USER

      - policy-id: order-service-policy
        route-id: order-service
        require-mfa: false
        request-signing-required: false
        required-scopes: []
        allowed-methods: [GET, POST, PUT, PATCH, DELETE]
        rate-limit-policy: USER

      - policy-id: payment-service-policy
        route-id: payment-service
        require-mfa: false
        request-signing-required: false
        required-scopes: []
        allowed-methods: [GET, POST]
        rate-limit-policy: PREMIUM

  request-signing:
    enabled: false  # set to true to require HMAC signatures
    timestamp-tolerance-seconds: 300
    nonce-ttl-seconds: 600
    shared-secret: ${HMAC_SHARED_SECRET:change-me-in-production}
  revocation:
    enabled: false  # set to true when Redis is available

  quota:
    enabled: false  # set to true when Redis is available
    default-daily-limit: 100000
    default-monthly-limit: 2000000
  rate-limit:
    enabled: false  # set to true when Redis is available (Docker/K8s)
    policies:
      ANONYMOUS:
        requests-per-minute: 100
      USER:
        requests-per-minute: 1000
      PREMIUM:
        requests-per-minute: 10000
      DEFAULT:
        requests-per-minute: 1000

  tenant-rate-limit:
    enabled: false  # set to true to activate per-tenant rate limit overrides
    # tenants:
    #   acme-corp:
    #     requests-per-minute: 5000
    #   trial-tenant:
    #     requests-per-minute: 50
  jwt:
    claims-forwarding:
      enabled: false  # set to true and add mappings to forward extra JWT claims as headers

  security:
    jwt:
      # Token issuer validated against every incoming JWT's `iss` claim.
      # Must match the Keycloak realm URL exactly (scheme + host + port + path).
      issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/sentinel}
      # Required JWT audience values. If empty, audience is not validated.
      # At least one value in the JWT `aud` claim must be in this list.
      required-audiences: []
  gateway:
    routes:
      - route-id: hello-service
        path: /api/hello/**
        service-uri: lb://hello-service
        methods: [GET]
        enabled: true
        required-scopes: []
        tenant-required: false
        rate-limit-policy: DEFAULT

      - route-id: user-service
        path: /api/users/**
        service-uri: lb://user-service
        methods: [GET, POST, PUT, PATCH, DELETE]
        enabled: true
        required-scopes: []
        tenant-required: false
        rate-limit-policy: DEFAULT

      - route-id: order-service
        path: /api/orders/**
        service-uri: lb://order-service
        methods: [GET, POST, PUT, PATCH, DELETE]
        enabled: true
        required-scopes: []
        tenant-required: false
        rate-limit-policy: DEFAULT

      - route-id: payment-service
        path: /api/payments/**
        service-uri: lb://payment-service
        methods: [GET, POST]
        enabled: true
        required-scopes: []
        tenant-required: false
        rate-limit-policy: DEFAULT

      # Example of a disabled route — demonstrates the disable feature.
      # Requests to /api/legacy/** will receive 404.
      - route-id: legacy-service
        path: /api/legacy/**
        service-uri: http://localhost:9999
        methods: [GET]
        enabled: false
        required-scopes: []
        tenant-required: false
        rate-limit-policy: DEFAULT

  webhook:
    enabled: false  # set to true to enable webhook event emission (SIEM / alerting)

  resilience:
    enabled: true  # set to false to disable all resilience filters globally
    retry:
      enabled: true
      attempts: 2           # retries after the initial attempt; total = attempts+1
      safe-methods: [GET, HEAD]
    circuit-breaker:
      enabled: true

# ─── Resilience4j Circuit Breaker Defaults ────────────────────────────────────
# Each route gets a circuit breaker named {routeId}-cb.
# Override per-route via resilience4j.circuitbreaker.instances.{name}.*.
resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        failureRateThreshold: 50   # open when ≥50% of last 20 calls fail
        waitDurationInOpenState: 30000   # ms to stay OPEN before going HALF_OPEN
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

logging:
  level:
    root: INFO
    com.sentinelgateway: DEBUG
    org.springframework.cloud.gateway: INFO
